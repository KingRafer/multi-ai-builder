<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiAI Office — Professional Game Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700&display=swap');

    :root {
      --bg-deep: #070b14;
      --bg-panel: #0c1220;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.45);
      --success: #10b981;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: #e2e8f0;
      overflow: hidden;
      height: 100vh;
    }

    .font-game { font-family: 'Orbitron', sans-serif; }

    /* Glass panels */
    .glass {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(12, 18, 32, 0.95));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    /* ========== OFFICE STAGE ========== */
    .office-stage {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
        linear-gradient(180deg, #0a0f1a 0%, #0f172a 35%, #0a0f1a 100%);
    }

    /* Floor grid with perspective feel */
    .floor-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(71, 85, 105, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(71, 85, 105, 0.08) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 20%, transparent 100%);
    }

    /* Ambient light orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.35;
    }

    /* ========== DESK + AGENT ========== */
    .desk-unit {
      position: absolute;
      width: 128px;
      height: 110px;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
      z-index: 10;
    }
    .desk-unit:hover { transform: translateY(-6px) scale(1.04); z-index: 30; }
    .desk-unit.active { z-index: 25; }
    .desk-unit.working { z-index: 20; }

    .desk-base {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 58px;
      background: linear-gradient(160deg, #3b4659 0%, #1e293b 60%, #0f172a 100%);
      border-radius: 10px 10px 6px 6px;
      border: 1.5px solid rgba(148, 163, 184, 0.25);
      box-shadow:
        0 10px 0 #0b1220,
        0 14px 28px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
<!-- PART1_CONTINUE -->
